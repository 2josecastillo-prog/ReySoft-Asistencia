<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">ReySoft Multiservices</title>
  <desc id="desc">ReySoft-Asistencia, software de asistencia escolar para centros educativos.</desc>
  <rect width="1200" height="630" fill="#F8FAFC"/>
  <rect x="70" y="70" width="1060" height="490" rx="28" fill="#FFFFFF" stroke="#DDE7F3"/>
  <defs>
    <linearGradient id="rey" x1="190" y1="0" x2="565" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#06265C"/>
      <stop offset="1" stop-color="#0B3B83"/>
    </linearGradient>
    <linearGradient id="soft" x1="565" y1="0" x2="945" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#12C8D0"/>
      <stop offset="1" stop-color="#16B7C4"/>
    </linearGradient>
  </defs>
  <text x="190" y="200" fill="url(#rey)" font-family="Montserrat, Poppins, Inter, Arial, sans-serif" font-size="98" font-weight="900" letter-spacing="0">REY</text>
  <text x="408" y="200" fill="url(#soft)" font-family="Montserrat, Poppins, Inter, Arial, sans-serif" font-size="98" font-weight="900" letter-spacing="0">SOFT</text>
  <text x="244" y="258" fill="#08265C" font-family="Montserrat, Poppins, Inter, Arial, sans-serif" font-size="39" font-weight="800" letter-spacing="15">MULTISERVICES</text>
  <text x="190" y="360" fill="#0F172A" font-family="Inter, Arial, sans-serif" font-size="44" font-weight="800">ReySoft-Asistencia</text>
  <text x="190" y="420" fill="#2563EB" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="700">Software de asistencia escolar</text>
  <text x="190" y="480" fill="#334155" font-family="Inter, Arial, sans-serif" font-size="27">Asistencia, estudiantes, tutores, reportes, WhatsApp y portal de padres.</text>
</svg>

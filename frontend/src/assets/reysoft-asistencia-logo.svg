<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 250" role="img" aria-labelledby="title desc">
  <title id="title">ReySoft Multiservices</title>
  <desc id="desc">Logo de ReySoft Multiservices con texto REYSOFT en azul y turquesa.</desc>
  <rect width="820" height="250" rx="18" fill="#FFFFFF"/>
  <defs>
    <linearGradient id="rey" x1="88" y1="0" x2="410" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#06265C"/>
      <stop offset="1" stop-color="#0B3B83"/>
    </linearGradient>
    <linearGradient id="soft" x1="410" y1="0" x2="735" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#12C8D0"/>
      <stop offset="1" stop-color="#16B7C4"/>
    </linearGradient>
  </defs>
  <text x="190" y="130" fill="url(#rey)" font-family="Montserrat, Poppins, Inter, Arial, sans-serif" font-size="82" font-weight="900" letter-spacing="0">REY</text>
  <text x="372" y="130" fill="url(#soft)" font-family="Montserrat, Poppins, Inter, Arial, sans-serif" font-size="82" font-weight="900" letter-spacing="0">SOFT</text>
  <text x="220" y="178" fill="#08265C" font-family="Montserrat, Poppins, Inter, Arial, sans-serif" font-size="34" font-weight="800" letter-spacing="13">MULTISERVICES</text>
</svg>
